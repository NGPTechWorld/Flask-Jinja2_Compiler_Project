<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="static/product_details.css" />
  </head>

  <body>
    <header>
      <div class="header-content">
        <div class="logo">Product Store</div>
        <a href="/" class="back-btn">
          <i class="fas fa-arrow-left"></i>
          Back to Products
        </a>
      </div>
    </header>

    <div class="container">
      <div id="product-data" hidden>
        {% for product in products %}
        <div
          class="product-record"
          data-id="{{ product.id }}"
          data-name="{{ product.name }}"
          data-price="{{ product.price }}"
          data-image="{{ product.image }}"
          data-description="{{ product.description }}"
        ></div>
        {% endfor %}
      </div>

      <div class="product-details-container">
        <div class="product-image-section">
          <img id="detail-image" src="" alt="" />
        </div>
        <div class="product-info-section">
          <h1 class="product-name" id="detail-name"></h1>
          <p class="product-price" id="detail-price"></p>
          <div class="product-description">
            <p id="detail-description"></p>
          </div>
          <div class="product-actions">
            <form
              id="delete-form"
              action="/delete-product/0"
              method="POST"
              onsubmit="return confirm('Are you sure you want to delete this product?');"
            >
              <button type="submit" class="btn btn-danger">
                <i class="fas fa-trash"></i> Delete Product
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="notification" class="notification">Product deleted successfully!</div>
    <script src="static/product_details.js"></script>
  </body>
</html>
