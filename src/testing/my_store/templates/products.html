<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Store</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="static/products.css" />
  </head>

  <body>
    <header>
      <div class="header-content">
        <div class="logo">Product Store</div>
        <a href="/add-product" class="add-product-btn">
          <i class="fas fa-plus"></i>
          Add New Product
        </a>
      </div>
    </header>

    <div class="container">
      {% if products %}
      <div class="products-grid">
        {% for product in products %}
        <div class="product-card">
          <img
            src="{{ product.image }}"
            alt="{{ product.name }}"
            class="product-image"
          />
          <div class="product-info">
            <h3 class="product-name">{{ product.name }}</h3>
            <p class="product-price">${{ product.price }}</p>
            <div class="product-actions">
              <a href="/product/{{ product.id }}" class="btn btn-primary">View Details</a>
              <form
                action="/delete-product/{{ product.id }}"
                method="POST"
                onsubmit="return confirm('Are you sure you want to delete this product?');"
              >
                <button type="submit" class="btn btn-danger">
                  <i class="fas fa-trash"></i> Delete
                </button>
              </form>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <div class="empty-state">
        <i class="fas fa-box-open"></i>
        <h3>No products found</h3>
        <p>Add a new product to get started</p>
      </div>
      {% endif %}
    </div>

    <div id="notification" class="notification">Product deleted successfully!</div>
  </body>
</html>
