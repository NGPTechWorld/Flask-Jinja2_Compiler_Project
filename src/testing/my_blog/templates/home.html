<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>My Blog</title>
    <link rel="stylesheet" href="static/blog.css" />
  </head>

  <body>
    <header>
      <div class="logo">My Blog</div>
      <a href="/about" class="nav-link">About</a>
    </header>

    <div class="container">
      {% if articles %}
      <div class="article-list">
        {% for article in articles %}
        <div class="article-card">
          <h3 class="article-title">{{ article.title }}</h3>
          <p class="article-meta">by {{ article.author }} - {{ article.views }} views</p>
          <a href="/article/{{ article.code }}" class="btn">Read more</a>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <div class="empty">
        <h3>No articles yet</h3>
      </div>
      {% endif %}
    </div>
  </body>
</html>
