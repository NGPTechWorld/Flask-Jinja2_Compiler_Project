<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Product</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="static/add_product.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div class="logo">Product Store</div><a href="products.html" class="back-btn"><i class="fas fa-arrow-left"></i>Back to Products</a>
      </div>
    </header>
    <div class="container">
      <div class="form-container">
        <h2 class="form-title">Add New Product</h2>
        <form action="/add-product" method="post" enctype="multipart/form-data">
          <div class="form-group"><label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter product name" required />
          </div>
          <div class="form-group"><label class="form-label">Price (USD)</label>
            <input type="number" name="price" class="form-control" min="0" step="0.01" placeholder="0.00" required />
          </div>
          <div class="form-group"><label class="form-label">Product Image</label>
            <input type="file" name="image" class="form-control" accept="image/*" required />
          </div>
          <div class="form-group"><label class="form-label">Description</label>
            <textarea name="description" class="form-control" placeholder="Write a brief description..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </form>
      </div>
    </div>
    <div id="notification" class="notification">Product added successfully!</div>
  </body>
</html>
