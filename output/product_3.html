<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="static/product_details.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div class="logo">Product Store</div><a href="products.html" class="back-btn"><i class="fas fa-arrow-left"></i>Back to Products</a>
      </div>
    </header>
    <div class="container">
      <div class="product-details-container">
        <div class="product-image-section"><img src="static/images/image3.jpg" alt="Sony WH-1000XM5 Headphones" /></div>
        <div class="product-info-section">
          <h1 class="product-name">Sony WH-1000XM5 Headphones</h1>
          <p class="product-price">$120</p>
          <div class="product-description">
            <p>Wireless headphones offering exceptional noise cancellation and superior sound quality for an immersive listening experience.</p>
          </div>
          <div class="product-actions">
            <form action="#" method="POST" onsubmit="return confirm('Are you sure you want to delete this product?');">
              <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i>Delete Product</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div id="notification" class="notification">Product deleted successfully!</div>
  </body>
</html>
